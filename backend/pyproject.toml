[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "glucoguide-api"
version = "0.1.0"
description = "Safety-first diabetes decision-support API"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
