name: GlucoGuide
options:
  bundleIdPrefix: com.glucoguide
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  GlucoGuide:
    type: application
    platform: iOS
    sources:
      - path: GlucoGuide
    info:
      path: GlucoGuide/Info.plist
      properties:
        CFBundleDisplayName: GlucoGuide
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glucoguide.app
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []

